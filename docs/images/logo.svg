  <defs>
    <path id="petal" d="M 0 0 Q -4.5 -6 -6 -11 Q -4.5 -14 -1.5 -12 Q 0 -10 1.5 -12 Q 4.5 -14 6 -11 Q 4.5 -6 0 0 Z"/>
  </defs>
  <g transform="translate(20 20)" fill="#d4486b">
    <use href="#petal" transform="rotate(0)"/>
    <use href="#petal" transform="rotate(72)"/>
    <use href="#petal" transform="rotate(144)"/>
    <use href="#petal" transform="rotate(216)"/>
    <use href="#petal" transform="rotate(288)"/>
  </g>
  <circle cx="20" cy="20" r="2.25" fill="#2a3653"/>
</svg>
