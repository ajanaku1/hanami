<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#222d49"/>
      <stop offset="1" stop-color="#161d30"/>
    </linearGradient>
    <path id="petal" d="M 0 0 Q -4.5 -6 -6 -11 Q -4.5 -14 -1.5 -12 Q 0 -10 1.5 -12 Q 4.5 -14 6 -11 Q 4.5 -6 0 0 Z"/>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- faint oversized sakura mark, bleeding off the right edge -->
  <g transform="translate(1010 315) scale(26)" fill="#d4486b" opacity="0.10">
    <use href="#petal" transform="rotate(0)"/>
    <use href="#petal" transform="rotate(72)"/>
    <use href="#petal" transform="rotate(144)"/>
    <use href="#petal" transform="rotate(216)"/>
    <use href="#petal" transform="rotate(288)"/>
  </g>

  <!-- solid sakura mark, top-left lockup -->
  <g transform="translate(120 150) scale(4)" fill="#d4486b">
    <use href="#petal" transform="rotate(0)"/>
    <use href="#petal" transform="rotate(72)"/>
    <use href="#petal" transform="rotate(144)"/>
    <use href="#petal" transform="rotate(216)"/>
    <use href="#petal" transform="rotate(288)"/>
  </g>
  <circle cx="120" cy="150" r="7" fill="#0f1626"/>

  <text x="172" y="166" font-size="58" font-weight="700" fill="#ffffff" letter-spacing="1">Hanami</text>

  <!-- headline -->
  <text x="120" y="330" font-size="62" font-weight="700" fill="#ffffff">An AI bouncer for your</text>
  <text x="120" y="404" font-size="62" font-weight="700" fill="#ffffff">NFT whitelist.</text>

  <!-- subline -->
  <text x="122" y="470" font-size="29" fill="#aab3c9">TEE-attested screening · ERC-7857 iNFT · chain-agnostic Merkle export</text>

  <!-- status pill -->
  <rect x="120" y="520" width="330" height="48" rx="24" fill="#d4486b"/>
  <text x="285" y="551" font-size="24" font-weight="700" fill="#ffffff" text-anchor="middle">Live on 0G mainnet · 16661</text>
</svg>
