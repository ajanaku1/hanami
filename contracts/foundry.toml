[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.24"
optimizer = true
optimizer_runs = 200
remappings = [
  "@openzeppelin/=lib/openzeppelin-contracts/",
  "forge-std/=lib/forge-std/src/",
]

[rpc_endpoints]
galileo = "${GALILEO_RPC_URL}"

[etherscan]
galileo = { key = "${CHAINSCAN_API_KEY}", url = "${CHAINSCAN_API_URL}", chain = 16602 }
